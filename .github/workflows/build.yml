name: Compilar APK Scrapbook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta web e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp *.png www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Scrapbook Digital" com.scrapbook.digital --web-dir=www
          npx cap add android

      - name: Inserir Icones Personalizados Corretamente no Android
        run: |
          # Copia o icon-512.png da raiz para a pasta www se necessário e injeta nas resoluções mipmap do Android
          if [ -f icon-512.png ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            
            cp icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            cp icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            cp icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi

      - name: Compilar o APK (Debug Assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
