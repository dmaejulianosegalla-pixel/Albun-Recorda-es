name: Compilar APK Scrapbook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta web, assets e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp *.png www/ || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -g @capacitor/assets
          
          npx cap init "Scrapbook Digital" com.scrapbook.digital --web-dir=www
          npx cap add android
          
          # Gera automaticamente todos os ícones nativos (adaptativos, redondos e quadrados) a partir do icon-512.png
          if [ -f icon-512.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor "#3f2e26"
          fi

      - name: Ajustar Conflitos do Kotlin e SDK do Android
        run: |
          # Forcar compileSdk 35, targetSdk 35 e minSdk 23 no Gradle
          echo "android { compileSdk 35; defaultConfig { targetSdk 35; minSdk 23; } }" >> android/app/build.gradle
          
          # Inserir resolucao de conflitos de dependencias kotlin no projeto raiz do android
          cat << 'EOF' >> android/build.gradle
          subprojects {
              project.configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.0'
                      }
                  }
              }
          }
          EOF

      - name: Compilar o APK (Debug Assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
